<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Store</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>
    <main>

        <h2>Product Details</h2>

        <!-- Product Details -->
        <section>

            <!-- Larger Product Image -->
            <div>
                <img
                    src="https://via.placeholder.com/500"
                    alt="Wireless Headphones"
                    width="500"
                >
            </div>

            <!-- Product Information -->
            <div>
                <h2>Wireless Headphones</h2>

                <p>
                    Enjoy high-quality sound with these comfortable
                    wireless headphones. Perfect for music, movies,
                    gaming, and everyday use.
                </p>

                <h3>Price: ₹1,999</h3>
 <label for="quantity">Quantity:</label>

                <select id="quantity" name="quantity">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <br><br>

                <!-- Add to Cart -->
                <button type="button">Add to Cart</button>
            </div>

        </section>
        <footer>
        <p>Contact: support@mystore.com | Phone: 9876543210</p>
        <p>&copy; 2026 My Store. All rights reserved.</p>
    </footer>


</body>
</html>
